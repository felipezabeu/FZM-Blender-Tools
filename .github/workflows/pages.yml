# Fresh deployments are triggered by a new commit, not rerunning an old Pages artifact.
name: Publish Blender Extension Repository
on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'scripts/prepare_builder_wheels.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender 5.1.2 for extension packaging
        run: |
          curl -fL --retry 3 https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.1.2-linux-x64/blender --version
      - name: Restore pinned FZM Builder wheels
        run: python3 scripts/prepare_builder_wheels.py
      - name: Build and index extension repository
        run: |
          set -euo pipefail
          B=/tmp/blender-5.1.2-linux-x64/blender
          mkdir -p site
          "$B" --command extension build --source-dir ./extensions/fzm_tile_panels --output-dir ./site
          "$B" --command extension build --source-dir ./extensions/fzm_builder --output-dir ./site --split-platforms
          for archive in site/fzm_builder-*.zip site/fzm_tile_panels-*.zip; do
            "$B" --command extension validate "$archive"
          done
          "$B" --command extension server-generate --repo-dir ./site --html
          test -s site/index.json
      - name: Verify the active extension index and archives
        run: |
          python3 - <<'PYINDEX'
          from pathlib import Path
          import hashlib, json, tomllib
          site = Path("site")
          manifest = tomllib.loads(Path("extensions/fzm_builder/blender_manifest.toml").read_text(encoding="utf-8"))
          entries = json.loads((site / "index.json").read_text(encoding="utf-8"))["data"]
          assert {"fzm_builder", "fzm_tile_panels"} == {entry["id"] for entry in entries}, entries
          builder = [entry for entry in entries if entry["id"] == manifest["id"]]
          assert len(builder) == len(manifest["platforms"]), builder
          assert {tuple(entry["platforms"]) for entry in builder} == {(platform,) for platform in manifest["platforms"]}, builder
          assert all(entry["version"] == manifest["version"] for entry in builder), builder
          tile_manifest = tomllib.loads(Path("extensions/fzm_tile_panels/blender_manifest.toml").read_text(encoding="utf-8"))
          tiles = [entry for entry in entries if entry["id"] == tile_manifest["id"]]
          assert len(tiles) == 1 and tiles[0]["version"] == tile_manifest["version"], tiles
          zip_names = {entry["archive_url"].removeprefix("./") for entry in entries}
          assert {p.name for p in site.glob("*.zip")} == zip_names
          for entry in entries:
              archive = site / entry["archive_url"].removeprefix("./")
              assert archive.stat().st_size == entry["archive_size"], entry
              assert "sha256:" + hashlib.sha256(archive.read_bytes()).hexdigest() == entry["archive_hash"], entry
          PYINDEX
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4